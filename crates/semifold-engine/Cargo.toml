[package]
name = "semifold-engine"
version = "0.2.4"
edition.workspace = true
description.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
bytes = "1.12.1"
camino = { version = "1.2.6", features = ["serde1"] }
gix = { version = "0.90.0", default-features = false, features = ["basic", "status", "worktree-mutation", "sha1", "parallel"] }
glob = "0.3.4"
httpdate = "1.0.3"
minijinja = { version = "3.0.5", default-features = false, features = ["serde"] }
octocrab = "0.54.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
semifold-changelog = { version = "0.3.2", path = "../changelog" }
semifold-core = { version = "0.1.1", path = "../semifold-core" }
semifold-resolver = { version = "0.4.2", path = "../resolver" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
toml_edit = { version = "0.25.18", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
