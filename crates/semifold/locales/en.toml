# BEGIN GENERATED SKILL GUIDES
# Generated by docs/scripts/generate-skill.mjs from docs/content/docs; do not edit.
[cli.skill.guides]
shared = "# Prepare and verify a task\n\nUse the installed `smif` or `semifold` executable that supplied this guide. Run the related command's `--help` for exact arguments. Refresh the guide after upgrading or switching executables.\n\nRead the repository instructions, Git diff, changeset configuration, and release workflow. The default configuration is `.changes/config.toml`. Package arguments use the keys in `[packages]`, and tags use the configured tag names.\n\nFollow the repository's release workflow and the requested task scope. Check hooks and configured commands before previewing version or publish operations. `--dry-run` skips Semifold-managed mutations; configured commands explicitly enabled for dry run can still execute. Publish preflight can access registries and run configured pre-checks.\n\nAfter changes, review the Git diff and run the repository's relevant checks. Report affected packages and the resulting state. If an operation fails, use its reported stage and partial results to choose the recovery steps in the task guide.\n\nFor additional command details, use the [command reference](https://semifold.noctisynth.org/docs/commands/reference/) or the [documentation index](https://semifold.noctisynth.org/llms.txt)."
changeset = "# Record a changeset\n\nRead the code diff and repository changeset policy. Select the configured package IDs and their `patch`, `minor`, or `major` bumps. Tags select changelog categories; release channels are configured separately.\n\nCreate a changeset for the change, using the grouping required by the repository. Non-interactive execution requires a file name, packages and bump levels, a configured tag or `--no-tag`, and a nonempty summary.\n\nReplace the example package and summary with the actual change:\n\n```bash\nsmif commit --name fix-parser --package core=patch --no-tag --summary \"Fix parser handling of empty input.\"\n```\n\nThe command creates a changeset file and leaves package versions unchanged. If the name already exists, choose another name. Run `smif status` to check affected packages, target versions, and dependency or shared-version propagation. Review the changeset and include it with the corresponding code change.\n\nSee [changesets](https://semifold.noctisynth.org/docs/commands/commit/) and [release status](https://semifold.noctisynth.org/docs/commands/status/)."
changeset_summary = "Record affected packages, version intent, and a summary for a change."
config = "# Maintain Semifold configuration\n\nChoose the operation for the configuration change:\n\n- For package additions, moves, renames, or removals, run `smif config sync --check`, then apply updates with `smif config sync`. Removing missing packages requires `--prune` and a complete successful discovery scan. Resolve reported conflicts before applying the update.\n- For supported legacy TOML fields, run `smif config migrate --check`, then `smif config migrate`. Migration can run before the configuration passes strict project validation. JSON configuration requires conversion separately.\n- For release channels, use `config channel set` or `config channel clear` with configured package IDs or `--all`. Review any one-time baseline bump; a successful version operation consumes it. For Node.js packages, a mismatched npm dist-tag is reported as a warning; update the publish command to match the channel.\n\n`--check` verifies the saved configuration and fails when it differs from the requested state. `--dry-run` previews changes without writing configuration. After applying an update, review the Git diff and rerun the corresponding check.\n\nSee [configuration commands](https://semifold.noctisynth.org/docs/commands/config/) for options and examples."
config_summary = "Synchronize packages, migrate supported legacy fields, or manage release channels."
init = "# Adopt Semifold in a repository\n\nRun `smif init` from the repository root to create a new Semifold configuration. For an existing project, use `smif config sync` to update package discovery. `init --force` replaces the configuration.\n\nFor non-interactive initialization, specify the ecosystems, base and release branches, default tags or no tags, and GitHub Actions or no GitHub Actions. `init --help` lists the corresponding options. Required choices must be supplied as arguments when prompts are unavailable.\n\nThe rendered release branch must differ from the base branch. CI maintains the release branch for the release pull request.\n\nUse `--dry-run` to preview initialization. After applying it, review the changeset configuration, discovered `[packages]` IDs and paths, resolver defaults, and generated GitHub Actions files.\n\nSee [initialization](https://semifold.noctisynth.org/docs/commands/init/) for supported choices and generated files."
init_summary = "Initialize package discovery, changeset configuration, and optional GitHub Actions."
release = "# Prepare and publish a release\n\n## GitHub Actions\n\nFor repositories using the generated GitHub Actions workflow:\n\n1. Create a changeset and check the plan with `smif status`.\n2. Merge the change into the configured base branch. `smif ci` prepares and maintains the release pull request.\n3. Review and merge the release pull request. CI publishes the prepared versions.\n\nThis workflow handles versioning and publishing in CI. `ci` runs only in GitHub Actions and skips branches other than the configured base branch. Pending changesets select release pull request preparation; no pending changesets select publishing. The rendered release branch must differ from the base branch.\n\n## Manual release\n\nFor repositories using a manual release workflow:\n\n1. Check configured hooks, pre-checks, and the worktree diff.\n2. Preview `smif version --dry-run`, then run `smif version`. This updates package versions, eligible internal requirements, and changelogs, and consumes changesets.\n3. Review the generated diff, run repository checks, and commit the version changes.\n4. Preview `smif publish --dry-run`, then run `smif publish`.\n\n`--allow-dirty` includes existing worktree changes in the operation. Dry-run-enabled configured commands can execute during previews, and publish preflight can access registries.\n\n## Recover a failed release\n\n- A planning or validation failure during version preparation leaves package files and changesets unchanged. A post-version hook failure can leave applied edits and retained changesets. Review the diff, fix the hook, and follow the reported recovery steps before retrying.\n- Publishing uses versioned manifests and changelogs. Check each package's `succeeded`, `failed`, `skipped`, or `not-started` status and its failed stage. Existing registry versions skip registry publishing. With GitHub Releases enabled, a missing Release may still be created; existing Releases do not receive missing assets automatically on retry.\n- For a CI failure, check the reported preparation, push, or release pull request stage and the corresponding files or remote results before retrying.\n- Status comment-write and changelog metadata failures can be warnings. Release pull request and publishing failures stop the corresponding operation.\n\nSee [versioning](https://semifold.noctisynth.org/docs/commands/version/), [publishing](https://semifold.noctisynth.org/docs/commands/publish/), [CI](https://semifold.noctisynth.org/docs/commands/ci/), and [status](https://semifold.noctisynth.org/docs/commands/status/) for detailed command behavior."
release_summary = "Release through GitHub Actions or a manual workflow, and recover from partial failures."
status = "# Review the release plan\n\nRun `smif status` to calculate the release plan from the repository configuration and pending changesets. The result includes current and target versions, directly requested bumps, dependency or shared-version propagation, warnings, and a plan fingerprint.\n\nStatus displays the plan without saving it or changing manifests, changelogs, configuration, or changesets. To adjust the plan, update the relevant changesets or dependency configuration and run status again.\n\n`status --comment` writes the plan to a GitHub pull-request comment in the supported CI environment. Global dry run skips the comment write. A comment-write failure is reported as a warning while retaining the computed plan; other GitHub query failures can stop the command.\n\nSee [release status](https://semifold.noctisynth.org/docs/commands/status/) for CI requirements and diagnostics."
status_summary = "Inspect target versions, changeset effects, and propagation."
