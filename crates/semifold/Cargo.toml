[package]
name = "semifold"
version = "0.3.4"
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "semifold"
path = "src/main.rs"

[[bin]]
name = "smif"
path = "src/smif.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
fern = "0.7.1"
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }
gix = { version = "0.90.0", default-features = false, features = ["basic", "status", "worktree-mutation", "sha1", "parallel"] }
glob = "0.3.4"
indicatif = "0.18.6"
inquire = "0.9.4"
log = "0.4.35"
octocrab = "0.54.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8.0", features = ["macros", "schemars", "transport-io"] }
rust-embed = "8.13.0"
rust-i18n = "4.2.4"
saphyr = "0.3.3"
schemars = "1.2.3"
semifold-changelog = { path = "../changelog", version = "0.3.2" }
semifold-core = { version = "0.1.1", path = "../semifold-core" }
semifold-engine = { version = "0.2.4", path = "../semifold-engine" }
semifold-resolver = { path = "../resolver", version = "0.4.2", features = [
  "clap",
] }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml_edit = "0.25.18"
unicode-width = "0.2.3"
