[package]
name = "semifold-resolver"
version = "0.4.2"
edition.workspace = true
description.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
boa_engine = "0.22.0"
boa_gc = "0.22.0"
boa_runtime = { version = "0.22.0", default-features = false, features = ["fetch", "url"] }
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"], optional = true }
glob = "0.3.4"
http = "1.5.0"
log = "0.4.35"
pathdiff = "0.2.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
saphyr = "0.3.3"
semifold-core = { version = "0.1.1", path = "../semifold-core" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }
toml_edit = { version = "0.25.18", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["semver-impl"], optional = true }

[dev-dependencies]
insta = "1.49.0"

[features]
ts-rs = ["dep:ts-rs"]
clap = ["dep:clap"]
