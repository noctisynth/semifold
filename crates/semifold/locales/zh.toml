# BEGIN GENERATED SKILL GUIDES
# Generated by docs/scripts/generate-skill.mjs from docs/content/docs; do not edit.
[cli.skill.guides]
shared = "# 准备与验证任务\n\n使用提供本指南的已安装 `smif` 或 `semifold` 可执行文件，通过相关命令的 `--help` 查询精确参数。升级或切换可执行文件后重新读取指南。\n\n读取仓库规则、Git diff、变更集配置和发布工作流。默认配置位于 `.changes/config.toml`。package 参数使用 `[packages]` 中的键名，tag 使用配置中的标签名称。\n\n按仓库发布工作流和任务范围执行。预览 version 或 publish 前，检查 hook 和配置命令。`--dry-run` 跳过 Semifold 管理的修改；明确允许 dry run 的配置命令仍可执行。发布预检可能访问软件包仓库并运行配置的 pre-check。\n\n修改后检查 Git diff，并运行仓库相关检查，报告受影响的包和执行结果。操作失败时，根据报告的失败阶段和部分结果，选择任务指南中的恢复步骤。\n\n更多命令细节见[命令参考](https://semifold.noctisynth.org/zh/docs/commands/reference/)或[文档索引](https://semifold.noctisynth.org/zh/llms.txt)。"
changeset = "# 记录变更集\n\n读取代码差异和仓库变更集规则，选择配置中的包 ID 及其 `patch`、`minor` 或 `major` 升级级别。tag 用于选择变更日志分类，发布通道另行配置。\n\n按仓库要求的分组方式为改动创建变更集。非交互执行需要提供文件名、包与升级级别、已配置 tag 或 `--no-tag`，以及非空摘要。\n\n将示例中的包和摘要替换为实际改动：\n\n```bash\nsmif commit --name fix-parser --package core=patch --no-tag --summary \"修复解析器对空输入的处理。\"\n```\n\n命令创建变更集文件，包版本保持不变。如果文件名已存在，选择其他名称。运行 `smif status`，检查受影响的包、目标版本，以及依赖或共享版本传播结果。检查变更集，并将其与对应代码改动一起提交。\n\n参考[变更集](https://semifold.noctisynth.org/zh/docs/commands/commit/)和[发布状态](https://semifold.noctisynth.org/zh/docs/commands/status/)。"
changeset_summary = "记录改动涉及的包、版本意图和摘要。"
config = "# 维护 Semifold 配置\n\n根据配置变更选择操作：\n\n- 新增、移动、重命名或移除包时，运行 `smif config sync --check`，再用 `smif config sync` 应用更新。移除缺失的包需要 `--prune`，并且发现扫描必须完整成功。应用前先处理命令报告的冲突。\n- 迁移支持的旧 TOML 字段时，运行 `smif config migrate --check`，再执行 `smif config migrate`。迁移可在配置通过严格项目校验之前运行。JSON 配置需要另外转换。\n- 管理发布通道时，使用 `config channel set` 或 `config channel clear`，通过配置中的包 ID 或 `--all` 选择范围。检查一次性的基线升级设置；成功的 version 操作会消费该设置。Node.js 包的 npm dist-tag 与通道不匹配时会报告警告，通过发布命令配置匹配的标签即可。\n\n`--check` 检查已保存配置，与请求状态存在差异时返回失败。`--dry-run` 预览变更，不写入配置。应用更新后检查 Git diff，并重新运行对应检查。\n\n选项和示例见[配置命令](https://semifold.noctisynth.org/zh/docs/commands/config/)。"
config_summary = "同步包、迁移支持的旧字段或管理发布通道。"
init = "# 在仓库中接入 Semifold\n\n在仓库根目录运行 `smif init`，创建 Semifold 配置。已有项目使用 `smif config sync` 更新包发现结果。`init --force` 会替换配置。\n\n非交互初始化需要指定扫描的生态、基础分支和发布分支、默认 tag 或不使用 tag，以及生成或不生成 GitHub Actions。`init --help` 列出了对应选项。无法使用交互提示时，必填选择需要通过参数提供。\n\n渲染后的发布分支必须不同于基础分支。CI 使用发布分支维护发布 PR。\n\n使用 `--dry-run` 预览初始化。应用后检查变更集配置、发现的 `[packages]` ID 与路径、resolver 默认值，以及生成的 GitHub Actions 文件。\n\n支持的选择和生成文件见[初始化文档](https://semifold.noctisynth.org/zh/docs/commands/init/)。"
init_summary = "初始化包发现、变更集配置与可选的 GitHub Actions。"
release = "# 准备与执行发布\n\n## GitHub Actions\n\n使用生成的 GitHub Actions 工作流时：\n\n1. 创建变更集，并用 `smif status` 检查计划。\n2. 将改动合并到配置的基础分支。`smif ci` 准备并维护发布 PR。\n3. 检查并合并发布 PR，由 CI 发布已准备的版本。\n\n此流程在 CI 中完成版本更新和发布。`ci` 只在 GitHub Actions 中运行，并跳过配置基础分支之外的分支。有待处理变更集时准备发布 PR，没有待处理变更集时执行发布。渲染后的发布分支必须不同于基础分支。\n\n## 手动发布\n\n使用手动发布工作流时：\n\n1. 检查配置的 hook、pre-check 和工作区差异。\n2. 预览 `smif version --dry-run`，再运行 `smif version`。该操作更新包版本、适用的内部依赖约束和变更日志，并消费变更集。\n3. 检查生成的差异，运行仓库检查，并提交版本改动。\n4. 预览 `smif publish --dry-run`，再运行 `smif publish`。\n\n`--allow-dirty` 将现有工作区改动纳入操作。明确允许 dry run 的配置命令可在预览中执行，发布预检也可能访问软件包仓库。\n\n## 恢复失败的发布\n\n- 版本准备期间的计划或校验失败会保留原有包文件和变更集。post-version hook 失败可能留下已应用的改动和保留的变更集。检查差异、修复 hook，再按报告的恢复步骤重试。\n- 发布使用版本文件和变更日志。检查各包的 `succeeded`、`failed`、`skipped` 或 `not-started` 状态及失败阶段。软件包仓库中已存在的版本会跳过发布。启用 GitHub Release 时仍可创建缺失的 Release；已有 Release 不会在重试时自动补传缺失附件。\n- CI 失败时，检查报告中的准备、推送或发布 PR 阶段，以及对应文件或远端结果，再重试。\n- status 评论写入和 changelog 元数据失败可能报告警告；发布 PR 操作和发布失败会停止对应操作。\n\n详细命令行为见[版本更新](https://semifold.noctisynth.org/zh/docs/commands/version/)、[发布](https://semifold.noctisynth.org/zh/docs/commands/publish/)、[CI](https://semifold.noctisynth.org/zh/docs/commands/ci/)和[状态](https://semifold.noctisynth.org/zh/docs/commands/status/)。"
release_summary = "使用 GitHub Actions 或手动流程发布，并从部分失败中恢复。"
status = "# 检查发布计划\n\n运行 `smif status`，根据仓库配置和待处理变更集计算发布计划。结果包括当前版本与目标版本、直接请求的升级、依赖或共享版本传播、警告和计划指纹。\n\nstatus 展示计划，不保存计划，也不修改清单文件、变更日志、配置或变更集。需要调整计划时，更新相应变更集或依赖配置，再次运行 status。\n\n`status --comment` 在支持的 CI 环境中，将计划写入 GitHub PR 评论。全局 dry run 跳过评论写入。评论写入失败会报告警告，并保留已计算的计划；其他 GitHub 查询失败可能使命令停止。\n\nCI 前置条件和诊断信息见[发布状态](https://semifold.noctisynth.org/zh/docs/commands/status/)。"
status_summary = "查看目标版本、变更集影响和传播结果。"
